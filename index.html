<!DOCTYPE html>
<html class="light" lang="zh-Hant">

<head>

  <style>
    * {
      box-sizing: border-box;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .fill-icon {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .ambient-shadow {
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    .hover-shadow:hover {
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
    }

    /* Parallax scene */
    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(1200px 600px at 20% 10%, #1b2333 0%, #0b0f1a 55%, #070a12 100%);
      border-radius: 12px 12px 0 0;
    }

    .layer {
      position: absolute;
      inset: 0;
      background-color: transparent;
      background-repeat: no-repeat;
      background-position: center bottom;
      background-size: auto 100%;
      transform: translate3d(0, 0, 0) scale(1);
      will-change: transform;
    }

    .layer.far {
      z-index: 1;
    }

    .layer.middle {
      z-index: 2;
    }

    .layer.near {
      z-index: 3;
    }

    .fog {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.15) 65%, rgba(255, 255, 255, 0.05) 100%);
      mix-blend-mode: screen;
    }

    /* Viewfinder frame */
    .vf-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 6;
      width: 17%;
      height: 17%;
      transform: translate(-50%, -50%);
      object-fit: contain;
      pointer-events: none;
    }

    /* Result overlay */
    .result-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
    }

    .result-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .result-card {
      background: white;
      border-radius: 20px;
      padding: 36px;
      text-align: center;
      max-width: 420px;
      width: 90%;
      transform: scale(0.9);
      transition: transform 0.4s;
    }

    .result-overlay.show .result-card {
      transform: scale(1);
    }

    .view-enter {
      animation: slideIn 0.35s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .pulse-hint {
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.7
      }

      50% {
        opacity: 1
      }
    }

    .star-anim {
      animation: starPop 0.4s ease-out both;
    }

    .star-anim:nth-child(2) {
      animation-delay: 0.15s;
    }

    .star-anim:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes starPop {
      from {
        transform: scale(0) rotate(-30deg);
        opacity: 0
      }

      to {
        transform: scale(1) rotate(0);
        opacity: 1
      }
    }

    .scene-hint {
      position: absolute;
      left: 20px;
      bottom: 20px;
      z-index: 7;
      padding: 8px 14px;
      background: rgba(5, 7, 12, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(6px);
      border-radius: 10px;
      font-size: 13px;
      color: #f3f4f7;
      pointer-events: none;
    }
  </style>
</head>

<body class="bg-background text-on-background min-h-screen font-sans antialiased">
  <div id="app"></div>

  <script>
    // =============================================

    // =============================================
    const LEVELS = [

      },
      {

        question: "拍攝蜻蜓的特寫鏡頭",
        technique: "特寫鏡頭",
        techniqueDesc: "近距離拍攝主體，可強調物體細節、傳達情緒。",
        image: "素材/q2.jpg",
        answerImage: null,
        instructions: [
          "移動取景框靠近場景中某個有細節的物體。",

        targetZone: { x: 0.25, y: 0.60, tolerance: 0.15 }
      },
      {
        id: 3,
        title: "引導線構圖",
        question: "用引導線構圖拍攝河流與山交接",
        technique: "引導線構圖",
        techniqueDesc: "利用畫面中的線條元素，將觀看者視線引導至視覺焦點。",
        image: "素材/q3_1.jpg",
        answerImage: "素材/q3_1.jpg",
        instructions: [
          "在場景中尋找具有線條感的元素（如河流、道路、山脊線）。",
          "移動取景框，讓線條從畫面邊緣延伸到中心。",

        ],

      },
      {
        id: 4,
        title: "中心點構圖",
        question: "用中心點構圖拍攝營地",
        technique: "中心點構圖",
        techniqueDesc: "將拍攝主體放置在畫面正中央，能瞬間集中視線、強調主題。",
        image: "素材/q4_1.png",
        answerImage: "素材/q4_1.png",
        instructions: [

        ],
        tips: "中心構圖適合對稱性強或有視覺衝擊力的主體。在這個場景中，嘗試把營地或最顯眼的物體放在取景框正中央！",

      },
      {
        id: 5,
        title: "前景構圖",
        question: "用前景構圖拍攝小橋和花卉",
        technique: "前景構圖",
        techniqueDesc: "在主體前方加入元素做為前景，增強相片立體感、層次感與故事性。",
        image: "素材/q5_1.jpg",
        answerImage: "素材/q5_1.jpg",
        instructions: [
          "觀察場景中的前景元素（如花卉、草叢、石頭）。",

        targetZone: { x: 0.35, y: 0.55, tolerance: 0.15 }
      },
      {
        id: 6,
        title: "遠景鏡頭",
        question: "拍攝山峰與天空的遠景鏡頭",
        technique: "遠景鏡頭",
        techniqueDesc: "涵蓋大量背景，用於表現風景的壯麗與遼闊。",
        image: "素材/q6.jpg",
        answerImage: null,
        instructions: [
          "遠景鏡頭需要涵蓋廣闘的場景。",
          "移動取景框到場景上方，對準遠方的山脈與天空。",
          "讓天空佔據上方、山脈填充下方，展現壯麗感。",
          "完成構圖後點擊「提交拍攝」。"
        ],
        tips: "遠景鏡頭的關鍵是展現場景的宏大規模。將取景框移到畫面上方，讓遠方山脈與天空成為主角，排除太多前景干擾！",
        targetZone: { x: 0.50, y: 0.30, tolerance: 0.15 }
      }
    ];

    // =============================================
    // App State
    // =============================================
    const state = {
      view: 'menu',
      selectedLevel: null,
      sessionLevels: [],     // 本次隨機抽取的 3 題
      completedLevels: {},   // 純記憶體，重新載入即清空
      capturedImages: {},    // levelId -> 拍攝位置資料
      showResult: false,
      isSubmitting: false
    };

    // Parallax engine state (shared by all levels)
    const pState = {
      targetX: 0, currentX: 0,
      targetY: 0, currentY: 0,
      bgTargetX: 0, bgCurrentX: 0,
      bgTargetY: 0, bgCurrentY: 0,
      bgHalfOffsetX: 200, bgHalfOffsetY: 120,
      frameMaxX: 150, frameMaxY: 100,
      initialized: false
    };

    let animId = null;

    // Preload layer images for canvas capture
    const layerImages = {};
    ['far', 'mid', 'near'].forEach(key => {
      const img = new Image();
      img.src = key === 'far' ? '素材/back2.png' : key === 'mid' ? '素材/middle.png' : '素材/front.png';
      layerImages[key] = img;
    });

    // 不再使用 localStorage（每次重新載入即清空）
    // 從題庫中隨機抽取指定數量的題目
    function pickRandomLevels(count) {
      const shuffled = [...LEVELS].sort(() => Math.random() - 0.5);
      return shuffled.slice(0, count);
    }
    // 取得關卡在本次題組中的順序索引
    function getSessionIndex(levelId) {
      return state.sessionLevels.findIndex(l => l.id === levelId);
    }
    function getOverallProgress() {
      const done = state.sessionLevels.filter(l => state.completedLevels[l.id]).length;
      return Math.round((done / state.sessionLevels.length) * 100);
    }
    function getLevelStatus(level) {
      return state.completedLevels[level.id] ? 'completed' : 'available';
    }
    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    // =============================================
    // Render
    // =============================================
    function render() {
      if (animId) { cancelAnimationFrame(animId); animId = null; }
      const app = document.getElementById('app');
      if (state.view === 'menu') {
        app.innerHTML = renderMenu();
        bindMenuEvents();
      } else if (state.view === 'album') {
        app.innerHTML = renderAlbum();
        bindAlbumEvents();
      } else {
        app.innerHTML = renderGame();
        bindGameEvents();
        initParallaxGame();
      }
    }

    // ---------- MENU ----------
    function renderMenu() {
      const progress = getOverallProgress();
      const cards = state.sessionLevels.map((level, sIdx) => {
        const done = !!state.completedLevels[level.id];
        const border = done
          ? 'border-transparent hover:border-outline-variant'
          : 'border-primary-fixed ring-1 ring-primary-fixed ring-offset-2 ring-offset-background hover:-translate-y-1';
        const btn = done
          ? `<button class="level-btn w-full bg-surface-variant text-primary font-label-md text-label-md py-3 rounded-lg hover:bg-surface-dim transition-colors border border-primary-fixed-dim" data-id="${level.id}">重新複習</button>`
          : `<button class="level-btn w-full bg-primary text-on-primary font-label-md text-label-md py-3 px-6 rounded-lg hover:bg-surface-tint shadow-sm hover:shadow-md transition-all flex items-center justify-center gap-2" data-id="${level.id}"><span class="material-symbols-outlined text-[18px]">play_arrow</span>開始學習</button>`;
        const badge = done ? 'bg-surface-container text-primary' : 'bg-primary-container text-on-primary-container';
        const doneTag = done ? '<div class="flex gap-1 mt-1 items-center text-secondary font-label-sm text-label-sm"><span class="material-symbols-outlined fill-icon" style="font-size:16px">check_circle</span>已拍攝</div>' : '';

        return `<div class="bg-surface-container-lowest rounded-xl p-space-xl flex flex-col h-full ambient-shadow hover-shadow transition-all duration-300 border ${border} group">
      <div class="w-full h-48 rounded-lg mb-space-lg overflow-hidden bg-surface-container flex items-center justify-center relative">
        <img src="${level.image}" alt="${level.title}" class="w-full h-full object-cover opacity-90 group-hover:scale-105 transition-transform duration-500"/>
      </div>
      <div class="${badge} px-3 py-1 rounded-full font-label-sm text-label-sm w-fit mb-space-md flex items-center gap-1">
        <span class="material-symbols-outlined text-[14px]">${done ? 'play_lesson' : 'route'}</span>第 ${sIdx + 1} 題
      </div>
      <h2 class="font-headline-sm text-headline-sm text-on-surface mb-space-sm">${level.title}</h2>
      <p class="font-body-md text-body-md text-on-surface-variant flex-grow mb-space-sm">${level.techniqueDesc}</p>
      ${doneTag}
      <div class="w-full bg-surface-container h-2 rounded-full mb-space-lg overflow-hidden mt-space-md"><div class="bg-primary h-full rounded-full transition-all duration-500" style="width:${done ? 100 : 0}%"></div></div>
      ${btn}
    </div>`;
      }).join('');

      return `
  <header class="bg-surface-container-lowest border-b border-outline-variant shadow-sm w-full sticky top-0 z-50">
    <div class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-4 max-w-max-width-content mx-auto">
      <div class="font-headline-md text-headline-md font-bold text-primary flex items-center gap-2">
        <span class="material-symbols-outlined fill-icon text-primary">photo_camera</span>EduQuest
      </div>
      <nav class="hidden md:flex items-center gap-space-xl">
        <a class="font-label-md text-label-md text-primary border-b-2 border-primary pb-1 opacity-80" href="#">Path</a>
        <a class="font-label-md text-label-md text-on-surface-variant font-medium hover:text-primary transition-colors" href="#">Library</a>
        <a class="font-label-md text-label-md text-on-surface-variant font-medium hover:text-primary transition-colors" href="#">Leaderboard</a>
        <a class="font-label-md text-label-md text-on-surface-variant font-medium hover:text-primary transition-colors" href="#">Shop</a>
      </nav>
      <div class="flex items-center gap-space-md text-primary">
        <button id="album-menu-btn" class="flex items-center gap-1 hover:bg-surface-container px-3 py-2 rounded-full transition-colors font-label-md text-label-md"><span class="material-symbols-outlined fill-icon text-[20px]">photo_library</span>相簿</button>
      </div>
    </div>
  </header>
  <main class="max-w-max-width-content mx-auto px-margin-mobile md:px-margin-desktop py-space-xxl view-enter">
    <div class="mb-space-xl text-center md:text-left flex flex-col md:flex-row justify-between items-end gap-space-md">
      <div>
        <h1 class="font-headline-xl text-headline-xl text-on-surface mb-space-sm">本次題組</h1>
        <p class="font-body-lg text-body-lg text-on-surface-variant">從題庫隨機抽取 3 題，完成所有題目即可查看相簿。重新整理頁面可取得新題組。</p>
      </div>
      <div class="bg-surface-container px-4 py-2 rounded-full flex items-center gap-space-sm shadow-sm border border-outline-variant">
        <span class="material-symbols-outlined text-primary">local_fire_department</span>
        <span class="font-label-md text-label-md text-on-surface">總進度 ${progress}%</span>
      </div>
    </div>

    // =============================================
    // Event Binding

    function bindMenuEvents() {

    function bindGameEvents() {

      document.getElementById('submit-btn').addEventListener('click', submitAnswer);

    // =============================================
    // Parallax Game Engine (from 實作/)
    // =============================================
    const FRAME_STEP_X = 20, FRAME_STEP_Y = 30, BG_STEP_X = 40, BG_STEP_Y = 30;
    const FAR_SCALE = 1, MID_SCALE = 1, NEAR_SCALE = 1;
    const EASE = 0.08;
    const SPEEDS = { far: 0, mid: 0.1, near: 1 };
    const CROUCH_SPEEDS = { far: 0, mid: 0.35, near: 0.18 };

    function resetParallax() {
      pState.targetX = 0; pState.currentX = 0;
      pState.targetY = 0; pState.currentY = 0;
      pState.bgTargetX = 0; pState.bgCurrentX = 0;
      pState.bgTargetY = 0; pState.bgCurrentY = 0;
    }

    function initParallaxGame() {
      const container = document.getElementById('game-container');
      container.innerHTML = `
    <div class="scene" id="g-scene" style="position:absolute;inset:0;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 60% 50%,#2a3a5c 0%,#10182a 20%);">
      <div class="layer far" id="g-far"></div>
      <div class="layer middle" id="g-mid"></div>
      <div class="layer near" id="g-near"></div>
      <div class="fog"></div>
      <img class="vf-frame" id="g-frame" src="素材/frame.png" alt="frame"/>
      <div class="scene-hint">← → ↑ ↓ 移動取景框</div>
    </div>`;

      const scene = document.getElementById('g-scene');
      const far = document.getElementById('g-far');
      const mid = document.getElementById('g-mid');
      const near = document.getElementById('g-near');
      const frame = document.getElementById('g-frame');

      far.style.backgroundImage = "url('素材/back2.png')";
      mid.style.backgroundImage = "url('素材/middle.png')";
      near.style.backgroundImage = "url('素材/front.png')";

      // Preload & compute sizes
      const imgs = [
        { el: far, src: '素材/back2.png' },
        { el: mid, src: '素材/middle.png' },
        { el: near, src: '素材/front.png' }
      ];

      function updateMetrics() {
        const rect = scene.getBoundingClientRect();
        const vw = rect.width, vh = rect.height;
        if (!vw || !vh) return;

        let bgMax = 0;
        const CROUCH_RANGE = 120;
        const midImg = new Image();
        midImg.onload = () => {
          const padFactor = 1.15;
          const s = Math.max(vh / midImg.naturalHeight, vw / midImg.naturalWidth) * padFactor;
          const w = midImg.naturalWidth * s, h = midImg.naturalHeight * s;
          far.style.backgroundSize = `${w}px ${h}px`;
          mid.style.backgroundSize = `${w}px ${h}px`;
          const nw = w * 1.15, nh = h * 1.15;
          near.style.backgroundSize = `${nw}px ${nh}px`;
          pState.bgW = w; pState.bgH = h;
          pState.nearBgW = nw; pState.nearBgH = nh;
          bgMax = Math.max(0, (w - vw) / 2);
          pState.bgHalfOffsetX = bgMax || 200;
          pState.bgHalfOffsetY = CROUCH_RANGE;
        };
        midImg.src = '素材/middle.png';

        const fw = frame.getBoundingClientRect().width || vw * 0.2;
        const fh = frame.getBoundingClientRect().height || vh * 0.2;
        pState.frameMaxX = Math.max(0, (vw - fw) / 2);
        pState.frameMaxY = Math.max(0, (vh - fh) / 2);

        pState.targetX = clamp(pState.targetX, -pState.frameMaxX, pState.frameMaxX);
        pState.targetY = clamp(pState.targetY, -pState.frameMaxY, pState.frameMaxY);
        pState.bgTargetX = clamp(pState.bgTargetX, -pState.bgHalfOffsetX, pState.bgHalfOffsetX);
        pState.bgTargetY = clamp(pState.bgTargetY, -pState.bgHalfOffsetY, pState.bgHalfOffsetY);
      }

      updateMetrics();
      window.addEventListener('resize', updateMetrics);

      // Animation loop
      function loop() {
        const smooth = 1 - Math.pow(1 - EASE, 1);
        pState.currentX += (pState.targetX - pState.currentX) * smooth;
        pState.currentY += (pState.targetY - pState.currentY) * smooth;
        pState.bgCurrentX += (pState.bgTargetX - pState.bgCurrentX) * smooth;
        pState.bgCurrentY += (pState.bgTargetY - pState.bgCurrentY) * smooth;

        const midX = pState.bgCurrentX * SPEEDS.mid;
        const nearX = pState.bgCurrentX * SPEEDS.near;
        const midY = pState.bgCurrentY * CROUCH_SPEEDS.mid;
        const nearY = pState.bgCurrentY * CROUCH_SPEEDS.near;

        far.style.backgroundPosition = '50% bottom';
        mid.style.backgroundPosition = `calc(50% + ${midX}px) calc(100% + ${midY}px)`;
        near.style.backgroundPosition = `calc(50% + ${nearX}px) calc(100% + ${nearY}px)`;

        frame.style.transform = `translate(calc(-50% + ${pState.currentX}px), calc(-50% + ${pState.currentY}px))`;

        animId = requestAnimationFrame(loop);
      }
      animId = requestAnimationFrame(loop);

      // Keyboard controls
      function onKey(e) {
        if (state.view !== 'game' || state.showResult) return;
        if (e.key === 'ArrowLeft') {
          if (pState.targetX <= -pState.frameMaxX + 0.5)
            pState.bgTargetX = clamp(pState.bgTargetX + BG_STEP_X, -pState.bgHalfOffsetX, pState.bgHalfOffsetX);
          else pState.targetX = clamp(pState.targetX - FRAME_STEP_X, -pState.frameMaxX, pState.frameMaxX);
          e.preventDefault();
        } else if (e.key === 'ArrowRight') {
          if (pState.targetX >= pState.frameMaxX - 0.5)
            pState.bgTargetX = clamp(pState.bgTargetX - BG_STEP_X, -pState.bgHalfOffsetX, pState.bgHalfOffsetX);
          else pState.targetX = clamp(pState.targetX + FRAME_STEP_X, -pState.frameMaxX, pState.frameMaxX);
          e.preventDefault();
        } else if (e.key === 'ArrowUp') {
          if (pState.targetY <= -pState.frameMaxY + 0.5)
            pState.bgTargetY = clamp(pState.bgTargetY + BG_STEP_Y, -pState.bgHalfOffsetY, pState.bgHalfOffsetY);
          else pState.targetY = clamp(pState.targetY - FRAME_STEP_Y, -pState.frameMaxY, pState.frameMaxY);
          e.preventDefault();
        } else if (e.key === 'ArrowDown') {
          if (pState.targetY >= pState.frameMaxY - 0.5)
            pState.bgTargetY = clamp(pState.bgTargetY - BG_STEP_Y, -pState.bgHalfOffsetY, pState.bgHalfOffsetY);
          else pState.targetY = clamp(pState.targetY + FRAME_STEP_Y, -pState.frameMaxY, pState.frameMaxY);
          e.preventDefault();
        }
      }
      window.removeEventListener('keydown', window._gKeyHandler);
      window._gKeyHandler = onKey;
      window.addEventListener('keydown', onKey);

      // Pointer drag
      let dragging = false, lastX = 0, lastY = 0;
      scene.addEventListener('pointerdown', e => {
        dragging = true; lastX = e.clientX; lastY = e.clientY;
        scene.setPointerCapture(e.pointerId);
      });
      scene.addEventListener('pointermove', e => {
        if (!dragging) return;
        const dx = e.clientX - lastX, dy = e.clientY - lastY;
        lastX = e.clientX; lastY = e.clientY;
        pState.targetX = clamp(pState.targetX + dx, -pState.frameMaxX, pState.frameMaxX);
        pState.targetY = clamp(pState.targetY + dy, -pState.frameMaxY, pState.frameMaxY);
      });
      scene.addEventListener('pointerup', () => { dragging = false; });
    }

    // =============================================
    // 提交拍攝（儲存位置資訊，純 CSS 還原）
    // =============================================
    function submitAnswer() {
      if (state.isSubmitting || state.showResult) return;
      state.isSubmitting = true;
      const level = state.selectedLevel;

      // Canvas-based real screenshot capture
      const scene = document.getElementById('g-scene');
      const rect = scene.getBoundingClientRect();
      const W = rect.width, H = rect.height;

      const frameW = W * 0.17, frameH = H * 0.17;
      const frameCX = W / 2 + pState.currentX;
      const frameCY = H / 2 + pState.currentY;
      const frameLeft = frameCX - frameW / 2;
      const frameTop = frameCY - frameH / 2;

      const bgW = pState.bgW || W;
      const bgH = pState.bgH || H;
      const nearBgW = pState.nearBgW || bgW * 1.15;
      const nearBgH = pState.nearBgH || bgH * 1.15;

      const midX = pState.bgCurrentX * SPEEDS.mid;
      const nearX = pState.bgCurrentX * SPEEDS.near;
      const midY = pState.bgCurrentY * CROUCH_SPEEDS.mid;
      const nearY = pState.bgCurrentY * CROUCH_SPEEDS.near;

      const farImgLeft = (W - bgW) / 2;
      const farImgTop = H - bgH;
      const midImgLeft = (W - bgW) / 2 + midX;
      const midImgTop = H - bgH + midY;
      const nearImgLeft = (W - nearBgW) / 2 + nearX;
      const nearImgTop = H - nearBgH + nearY;

      const canvas = document.createElement('canvas');
      const dpr = 2;
      canvas.width = frameW * dpr;
      canvas.height = frameH * dpr;
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);

      // Draw background gradient
      const grad = ctx.createRadialGradient(frameW * 0.6, frameH * 0.5, 0, frameW * 0.6, frameH * 0.5, frameW);
      grad.addColorStop(0, '#2a3a5c');
      grad.addColorStop(1, '#10182a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, frameW, frameH);

      const draws = [
        { img: layerImages.far, x: farImgLeft - frameLeft, y: farImgTop - frameTop, w: bgW, h: bgH },
        { img: layerImages.mid, x: midImgLeft - frameLeft, y: midImgTop - frameTop, w: bgW, h: bgH },
        { img: layerImages.near, x: nearImgLeft - frameLeft, y: nearImgTop - frameTop, w: nearBgW, h: nearBgH }
      ];
      draws.forEach(d => {
        if (d.img.complete && d.img.naturalWidth) ctx.drawImage(d.img, d.x, d.y, d.w, d.h);
      });

      state.capturedImages[level.id] = canvas.toDataURL('image/jpeg', 0.92);

      // 標記完成
      state.completedLevels[level.id] = true;
      state.showResult = true;

      // 更新彈窗
      const overlay = document.getElementById('result-overlay');
      document.getElementById('result-icon').innerHTML =
        '<span class="material-symbols-outlined fill-icon text-secondary" style="font-size:64px">check_circle</span>';
      document.getElementById('result-title').textContent = '拍攝完成！';
      document.getElementById('result-message').textContent =
        `「${level.title}」已成功拍攝，影像已儲存至相簿。`;

      const sIdx = getSessionIndex(level.id);
      const nextLevel = sIdx < state.sessionLevels.length - 1 ? state.sessionLevels[sIdx + 1] : null;
      document.getElementById('next-btn').textContent = nextLevel ? '下一關' : '回到主選單';

      setTimeout(() => overlay.classList.add('show'), 100);
      state.isSubmitting = false;
    }

    function renderAlbum() {
      const items = state.sessionLevels.map((level, sIdx) => {
        const dataUrl = state.capturedImages[level.id];
        const captured = !!dataUrl;

        const imgHTML = captured

            </div>`;

        return `

             ${captured ? `data-lid="${level.id}" style="cursor:pointer;"` : ''}>

            ${imgHTML}

          </div>
          <div class="p-4">
            <div class="font-label-sm text-label-sm text-outline mb-1">第 ${sIdx + 1} 題</div>
            <div class="font-headline-sm text-headline-sm text-on-surface">${level.title}</div>
            <div class="font-body-sm text-body-sm ${captured ? 'text-secondary' : 'text-outline'} mt-1 flex items-center gap-1">
              <span class="material-symbols-outlined ${captured ? 'fill-icon' : ''}" style="font-size:16px">${captured ? 'check_circle' : 'radio_button_unchecked'}</span>
              ${captured ? '已拍攝（點擊放大）' : '尚未拍攝'}
            </div>
          </div>
        </div>`;
      }).join('');

      return `
      <style>
        .album-card:hover .album-hover-overlay { opacity:1 !important; }
        #lightbox { display:none; position:fixed; inset:0; z-index:200;
          background:rgba(0,0,0,0.88); align-items:center; justify-content:center; }
        #lightbox.open { display:flex; }
      </style>
      <!-- 燈箱 -->
      <div id="lightbox">
        <div style="position:relative;width:min(90vw, calc(90vh * 4/3));max-width:900px;">
          <button id="lightbox-close" style="position:absolute;top:-44px;right:0;background:none;border:none;color:white;font-size:32px;cursor:pointer;line-height:1;">✕</button>
          <div id="lightbox-scene" style="width:100%;aspect-ratio:4/3;position:relative;overflow:hidden;border-radius:16px;background:#10182a;"></div>
          <p id="lightbox-label" style="color:rgba(255,255,255,0.7);text-align:center;margin-top:12px;font-size:14px;"></p>
        </div>
      </div>
      <header class="bg-surface-container-lowest border-b border-outline-variant shadow-sm w-full sticky top-0 z-50">
        <div class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-4 max-w-max-width-content mx-auto">
          <button id="album-back-btn" class="flex items-center gap-1 text-primary hover:text-primary-container font-label-md text-label-md transition-colors p-2 hover:bg-surface-container rounded-full">
            <span class="material-symbols-outlined text-sm">arrow_back</span>返回主選單
          </button>
          <div class="font-headline-md text-headline-md font-bold text-primary flex items-center gap-2">
            <span class="material-symbols-outlined fill-icon">photo_library</span>拍攝相簿
          </div>
          <div style="width:80px"></div>
        </div>
      </header>
      <main class="max-w-max-width-content mx-auto px-margin-mobile md:px-margin-desktop py-space-xxl view-enter">
        <h1 class="font-headline-xl text-headline-xl text-on-surface mb-space-sm">拍攝相簿</h1>
        <p class="font-body-lg text-body-lg text-on-surface-variant mb-space-xl">每一關的構圖成果都保存在這裡。點擊已拍攝的卡片可放大檢視。</p>
        <div class="grid grid-cols-2 md:grid-cols-3 gap-gutter">${items}</div>
      </main>`;
    }

    function bindAlbumEvents() {
      document.getElementById('album-back-btn').addEventListener('click', () => {
        state.view = 'menu'; render();
      });

      // 燈箱開啟
      document.querySelectorAll('.album-card').forEach(card => {
        card.addEventListener('click', () => {
          const lid = parseInt(card.dataset.lid);
          const dataUrl = state.capturedImages[lid];
          const level = LEVELS.find(l => l.id === lid);
          if (!dataUrl) return;

          document.getElementById('lightbox-scene').innerHTML =
            `<img src="${dataUrl}" alt="${level ? level.title : ''}" style="width:100%;height:100%;object-fit:contain;border-radius:16px;"/>`;
          document.getElementById('lightbox-label').textContent =
            `關卡 ${lid}：${level ? level.title : ''}`;
          document.getElementById('lightbox').classList.add('open');
        });
      });

      // 燈箱關閉
      document.getElementById('lightbox-close').addEventListener('click', () => {
        document.getElementById('lightbox').classList.remove('open');
      });
      document.getElementById('lightbox').addEventListener('click', e => {
        if (e.target === document.getElementById('lightbox'))
          document.getElementById('lightbox').classList.remove('open');
      });
    }

    // =============================================
    // Init
    // =============================================
    localStorage.clear(); // 每次載入清空所有緩存
    state.sessionLevels = pickRandomLevels(3);
    render();
  </script>
</body>

</html>
